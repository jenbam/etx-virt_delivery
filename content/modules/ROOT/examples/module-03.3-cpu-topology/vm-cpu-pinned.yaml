apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cpu-demo-vm-pinned
  namespace: virt-lab
spec:
  running: false
  template:
    metadata:
      labels:
        kubevirt.io/domain: cpu-demo-vm-pinned
    spec:
      domain:
        cpu:
          sockets: 2
          cores: 1
          threads: 1
          dedicatedCpuPlacement: true # CPU Pinning Enabled
        numa:
          guestMappingPassthrough: {}
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 2Gi
            cpu: "2"
          limits:
            cpu: "2"
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: fedora
              password: redhat
              chpasswd: { expire: False }
              ssh_pwauth: True
